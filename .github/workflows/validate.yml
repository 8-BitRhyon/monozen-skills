name: Validate Skills & Manifest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073
        with:
          ruby-version: '3.2'
          bundler-cache: false
      - name: Run Skill Validation Suite
        run: npm run validate
      - name: Run Validator Self-Tests
        run: npm test
      - name: Run Consumer Smoke Test
        run: bash scripts/smoke-test.sh
      - name: Run LLM-as-Verifier reference self-check
        run: node skills/llm-as-verifier/scripts/llm-verifier.mjs --self-check
      - name: Run LLM-as-Verifier functional tests (mock logprob endpoint)
        run: npm run test:verifier
      - name: Verify Manifest Synchronization
        run: |
          npm run manifest
          git diff --exit-code skills-lock.json || (echo "❌ skills-lock.json is out of sync. Run 'npm run manifest' locally and commit the result." && exit 1)
      - name: Enforce SHA-pinned actions
        uses: zgosalvez/github-actions-ensure-sha-pinned-actions@60e3a74c7b74a319e8e53e46bc455205f7173e1a # v5.0.8

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Secret scan with gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
