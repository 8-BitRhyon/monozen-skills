name: Validate Skills & Manifest

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Skill Validation Suite
        run: npm run validate

      - name: Verify Manifest Synchronization
        run: |
          npm run manifest
          git diff --exit-code skills-lock.json || (echo "❌ skills-lock.json is out of sync with skills/ directory. Run 'npm run manifest' locally and commit the result." && exit 1)
